name: PR Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID || 'gemini-ent-playground' }}
      GOOGLE_CLOUD_LOCATION: ${{ vars.GCP_REGION || 'global' }}
      GOOGLE_GENAI_USE_VERTEXAI: 'true'
      GCP_PROJECT: ${{ vars.GCP_PROJECT_ID || 'gemini-ent-playground' }}
      GCP_CREDENTIALS_CONFIGURED: ${{ secrets.GCP_CREDENTIALS != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets with gitleaks
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gitleaks >/dev/null 2>&1; then
            gl_ver="8.24.2"
            tmp_gl="$(mktemp -d)"
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${gl_ver}/gitleaks_${gl_ver}_linux_x64.tar.gz" -o "${tmp_gl}/gitleaks.tar.gz"
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${gl_ver}/gitleaks_${gl_ver}_checksums.txt" -o "${tmp_gl}/checksums.txt"
            expected_sha="$(awk '/gitleaks_8\.24\.2_linux_x64\.tar\.gz$/ {print $1}' "${tmp_gl}/checksums.txt")"
            echo "${expected_sha}  ${tmp_gl}/gitleaks.tar.gz" | sha256sum -c -
            mkdir -p "$HOME/.local/bin"
            tar -xzf "${tmp_gl}/gitleaks.tar.gz" -C "$HOME/.local/bin" gitleaks
            chmod +x "$HOME/.local/bin/gitleaks"
            rm -rf "${tmp_gl}"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          gitleaks dir . --no-banner --redact --exit-code 2

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Lint with Ruff
        run: uvx ruff check .

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: ${{ !github.event.pull_request.head.repo.fork && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: '${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ vars.GCP_SERVICE_ACCOUNT }}'

      - name: Authenticate to Google Cloud (Credentials Fallback)
        if: ${{ !github.event.pull_request.head.repo.fork && (vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == '') && env.GCP_CREDENTIALS_CONFIGURED == 'true' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Lint GitHub Actions workflows with actionlint
        shell: bash
        run: |
          set -euo pipefail
          al_ver="1.7.7"
          tmp_al="$(mktemp -d)"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${al_ver}/actionlint_${al_ver}_linux_amd64.tar.gz" -o "${tmp_al}/actionlint.tar.gz"
          tar -xzf "${tmp_al}/actionlint.tar.gz" -C "${tmp_al}" actionlint
          "${tmp_al}/actionlint"
          rm -rf "${tmp_al}"

      - name: Run unit tests with coverage gate
        run: touch .env && uv run pytest tests/unit/ --cov=app --cov-fail-under=80

  container-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build production Docker image
        run: docker build -t cymbal-coffee-smoke:test .

      - name: Run container smoke test (port 8080, /, /dashboard, /health, A2A card)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name cymbal-smoke \
            --memory=2g \
            -p 8080:8080 \
            -e GOOGLE_CLOUD_PROJECT=gemini-ent-playground \
            -e GOOGLE_CLOUD_LOCATION=global \
            -e GOOGLE_GENAI_USE_VERTEXAI=true \
            -e MOCK_LLM_FOR_TEST=TRUE \
            cymbal-coffee-smoke:test
          trap 'docker logs cymbal-smoke || true; docker rm -f cymbal-smoke || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          curl -sf http://127.0.0.1:8080/health | jq -e '.status == "healthy"'
          # Verify "/" serves Cymbal Coffee dashboard directly without redirecting to /dev-ui/
          ROOT_CODE="$(curl -s -o /tmp/root.html -w '%{http_code}' http://127.0.0.1:8080/)"
          test "${ROOT_CODE}" = "200"
          grep -q "Cymbal Coffee Roasters" /tmp/root.html

          DASH_CODE="$(curl -s -o /tmp/dash.html -w '%{http_code}' http://127.0.0.1:8080/dashboard)"
          test "${DASH_CODE}" = "200"
          grep -q "Wake Up Demo" /tmp/dash.html

          # Verify app boots in IDLE mode
          curl -sf http://127.0.0.1:8080/api/dashboard/data | jq -e '.simulation.is_active == false'

          # Verify A2A agent card is served
          curl -sf http://127.0.0.1:8080/a2a/app/.well-known/agent-card.json | jq -e '.name != null'
